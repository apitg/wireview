name: Build WireView

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
            artifact: "src-tauri/target/release/bundle/appimage/*.AppImage"
          - os: windows-latest
            args: ""
            artifact: "wireview-portable.zip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: npm ci
      - name: Prepare fixed WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\WebView2Runtime | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2.FixedVersionRuntime.win-x64/128.0.2739.42" -OutFile webview2.nupkg
          Expand-Archive -Path webview2.nupkg -DestinationPath webview2-package -Force
          $runtime = Get-ChildItem webview2-package -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $runtime) { throw "Fixed WebView2 runtime was not found in the package." }
          Copy-Item "$($runtime.Directory.FullName)\*" src-tauri\WebView2Runtime -Recurse -Force
      - name: Build desktop bundle
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Package portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wireview-portable | Out-Null
          Copy-Item src-tauri\target\release\wireview.exe wireview-portable\
          Copy-Item src-tauri\WebView2Runtime wireview-portable\WebView2Runtime -Recurse
          Compress-Archive -Path wireview-portable\* -DestinationPath wireview-portable.zip -Force
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireview-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          draft: true
          generate_release_notes: true
